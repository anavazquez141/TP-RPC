syntax = "proto3";

option java_package = "RpcDonaciones.grpc";
option java_outer_classname = "EventoSolidarioServiceProto";

import "usuarioService.proto";

message Evento {
    int64 idEvento = 1;
    string nombreEvento = 2;
    string descripcion = 3;
    string fechaHora = 4;
    repeated usuario.UsuarioSinClave usuarios = 5;
}

message EventoSinUsuarios {
    int64 idEvento = 1;
    string nombreEvento = 2;
    string descripcion = 3;
    string fechaHora = 4;
}

message CreateEventoRequest {
    string token = 1;
    string nombreEvento = 2;
    string descripcion = 3;
    string fechaHora = 4;
    repeated int64 usuarioIds = 5;
    usuario.Role rol = 6;
}

message CreateEventoResponse {
    Evento evento = 1;
    string status = 2; 
    string message = 3; 
}

message GetEventoRequest {
    string token = 1;
    int64 idEvento = 2;
}

message GetEventoResponse {
    Evento evento = 1;
    string status = 2;
    string message = 3;
}

message UpdateEventoRequest {
    string token = 1;
    int64 idEvento = 2;
    string nombreEvento = 3;
    string descripcion = 4;
    string fechaHora = 5;
    repeated int64 usuarioIds = 6;
    usuario.Role rol = 7;
}

message UpdateEventoResponse {
    Evento evento = 1;
    string status = 2;
    string message = 3;
}

message DeleteEventoRequest {
    string token = 1;
    int64 idEvento = 2;
    usuario.Role rol = 3;
}

message DeleteEventoResponse {
    bool success = 1;
    string status = 2;
    string message = 3;
}

message ListEventosRequest {
    string token = 1;
}

message ListEventosResponse {
    repeated EventoSinUsuarios eventos = 1;
    string status = 2;
    string message = 3;
}

service EventosService {
    rpc CreateEvento(CreateEventoRequest) returns (CreateEventoResponse);
    rpc GetEvento(GetEventoRequest) returns (GetEventoResponse);
    rpc UpdateEvento(UpdateEventoRequest) returns (UpdateEventoResponse);
    rpc DeleteEvento(DeleteEventoRequest) returns (DeleteEventoResponse);
    rpc ListEventos(ListEventosRequest) returns (ListEventosResponse);
}