<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Evento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <!-- Mostrar mensajes flash -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <p class="{{ category }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <h1>Registrar Evento</h1>

    <form method="POST">
        <label>Nombre:</label>
        <input type="text" name="nombreEvento" value="{{ request.form.nombreEvento or '' }}" required>

        <label>Descripción:</label>
        <textarea name="descripcion" required>{{ request.form.descripcion or '' }}</textarea>

        <label>Fecha y Hora:</label>
        <input type="datetime-local" name="fechaHora" value="{{ request.form.fechaHora or '' }}" required>

        <label>Usuarios:</label>
        <select name="usuarioIds" multiple>
            {% for usuario in usuarios %}
                <option value="{{ usuario.id }}" {% if usuario.id in request.form.getlist('usuarioIds') %}selected{% endif %}>
                    {{ usuario.nombre }} {{ usuario.apellido }}
                </option>
            {% endfor %}
        </select>

        <button type="submit" class="btn primary">Registrar</button>
    </form>

    <a href="{{ url_for('eventos') }}" class="btn secondary">Volver a Eventos</a>
</body>
</html>
