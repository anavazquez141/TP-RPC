<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Nuevo Usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

    <div class="profile-card">

        <h2>Registrar Nuevo Usuario</h2>

        <!-- Mensajes -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <p class="{{ 'success' if category == 'success' else 'error' }}">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Formulario Registrar -->
        <form method="POST" action="{{ url_for('usuarios.registrar_usuario') }}" class="modern-login-form">
            <div class="input-group">
                <input type="text" id="nombreUsuario" name="nombreUsuario" required placeholder=" ">
                <label>Nombre de Usuario</label>
            </div>
            <div class="input-group">
                <input type="text" id="nombre" name="nombre" required placeholder=" ">
                <label>Nombre</label>
            </div>
            <div class="input-group">
                <input type="text" id="apellido" name="apellido" required placeholder=" ">
                <label>Apellido</label>
            </div>
            <div class="input-group">
                <input type="text" id="telefono" name="telefono" required placeholder=" ">
                <label>Teléfono</label>
            </div>
            <div class="input-group">
                <input type="email" id="email" name="email" required placeholder=" ">
                <label>Email</label>
            </div>

            <div class="input-group-row">
                <label for="rol">Rol:</label>
                <select id="rol" name="rol">
                    <option value="PRESIDENTE">Presidente</option>
                    <option value="VOCAL">Vocal</option>
                    <option value="COORDINADOR">Coordinador</option>
                    <option value="VOLUNTARIO">Voluntario</option>
                </select>
            </div>

            <button type="submit">Registrar Usuario</button>
        </form>

        <!-- Enlaces -->
        <div class="actions">
            <a href="{{ url_for('auth.index') }}" class="btn secondary">Volver al Perfil</a>
            <a href="{{ url_for('auth.logout') }}" class="btn secondary">Cerrar Sesión</a>
        </div>

    </div>

</body>
</html>
