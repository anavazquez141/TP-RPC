<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Evento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <h1>Modificar Evento</h1>

    <form method="POST">
        <label>Nombre:</label>
        <input type="text" name="nombreEvento" value="{{ evento.nombre }}" required>

        <label>Descripción:</label>
        <textarea name="descripcion" required>{{ evento.descripcion }}</textarea>

        <label>Fecha y Hora:</label>
        <input type="datetime-local" name="fechaHora" value="{{ evento.fecha_hora }}" required>

        <label>Usuarios asignados:</label>
        <select name="usuarioIds" multiple>
            {% for u in usuarios %}
            <option value="{{ u.id }}" {% if u.id in evento.usuario_ids %}selected{% endif %}>{{ u.nombreUsuario }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn primary">Actualizar</button>
    </form>

    <form method="POST" style="margin-top:10px;">
        <input type="hidden" name="eliminar" value="1">
        <button type="submit" class="btn secondary">Eliminar Evento</button>
    </form>

    <a href="{{ url_for('eventos') }}" class="btn secondary">Volver a Eventos</a>
</body>
</html>
