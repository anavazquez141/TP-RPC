<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <h1>Modificar Usuario</h1>

    <form action="{{ url_for('modificar', user_id=usuario.id) }}" method="POST">
        <input type="text" name="nombreUsuario" placeholder="Nombre de usuario" value="{{ usuario.nombreUsuario }}" required>
        <input type="text" name="nombre" placeholder="Nombre" value="{{ usuario.nombre }}" required>
        <input type="text" name="apellido" placeholder="Apellido" value="{{ usuario.apellido }}" required>
        <input type="text" name="telefono" placeholder="Teléfono" value="{{ usuario.telefono }}" required>
        <input type="email" name="email" placeholder="Email" value="{{ usuario.email }}" required>
        <input type="password" name="clave" placeholder="Clave" value="" required>

        <!-- Selección de rol -->
        <select name="rol">
            <option value="VOLUNTARIO" {% if usuario.rol == 'VOLUNTARIO' %}selected{% endif %}>Voluntario</option>
            <option value="PRESIDENTE" {% if usuario.rol == 'PRESIDENTE' %}selected{% endif %}>Presidente</option>
            <option value="VOCAL" {% if usuario.rol == 'VOCAL' %}selected{% endif %}>Vocal</option>
            <option value="COORDINADOR" {% if usuario.rol == 'COORDINADOR' %}selected{% endif %}>Coordinador</option>
        </select>

        <button type="submit">Guardar Cambios</button>
    </form>

    <p><a href="{{ url_for('index') }}">Volver a la lista de usuarios</a></p>

    <!-- Mensajes -->
    {% if mensaje %}
    <p style="color: green;">{{ mensaje }}</p>
    {% endif %}
</body>
</html>
