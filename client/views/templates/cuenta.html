<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administrar Cuenta - {{ usuario.nombreUsuario }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body class="login-body">

<div class="profile-card modern-form">

    <!-- Nombre de usuario -->
    <h2>{{ usuario.nombreUsuario }}</h2>

    <!-- Mensajes flash -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p class="{{ 'success' if category == 'success' else 'error' }}">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- Formulario para modificar cuenta -->
    <form method="POST" action="{{ url_for('usuarios.cuenta') }}" class="modern-login-form">
        <div class="input-group">
            <input type="text" name="nombreUsuario" value="{{ usuario.nombreUsuario }}" required placeholder=" ">
            <label>Nombre de Usuario</label>
        </div>
        <div class="input-group">
            <input type="text" name="nombre" value="{{ usuario.nombre }}" required placeholder=" ">
            <label>Nombre</label>
        </div>
        <div class="input-group">
            <input type="text" name="apellido" value="{{ usuario.apellido }}" required placeholder=" ">
            <label>Apellido</label>
        </div>
        <div class="input-group">
            <input type="text" name="telefono" value="{{ usuario.telefono }}" required placeholder=" ">
            <label>Teléfono</label>
        </div>
        <div class="input-group">
            <input type="email" name="email" value="{{ usuario.email }}" required placeholder=" ">
            <label>Email</label>
        </div>
        <button type="submit">Modificar Cuenta</button>
    </form>

    <!-- Formulario para eliminar cuenta -->
    <form method="POST" action="{{ url_for('usuarios.cuenta') }}"
          onsubmit="return confirm('¿Seguro que deseas eliminar tu cuenta? Esta acción no se puede deshacer.');"
          class="modern-login-form" style="margin-top: 15px;">
        <input type="hidden" name="eliminar" value="true">
        <button type="submit" class="delete-btn">Eliminar Cuenta</button>
    </form>

    <!-- Enlaces -->
    <div class="actions">
        <a href="{{ url_for('auth.index') }}" class="btn secondary">Volver al perfil</a>
        <a href="{{ url_for('auth.logout') }}" class="btn secondary">Cerrar Sesión</a>
    </div>

</div>

</body>
</html>
