syntax = "proto3";
option java_package = "RpcDonaciones.grpc";
option java_outer_classname = "AuthServiceProto";

service AuthService {
    rpc login (LoginRequest) returns (LoginResponse);
}

message LoginRequest {
    string email = 1;
    string clave = 2;
}

message LoginResponse {
    string token = 1; // JWT u otro token de autenticación
    string status = 2; // e.g., "SUCCESS", "FAILURE"
    string message = 3; // Mensaje opcional (e.g., "Credenciales invalidas")
}