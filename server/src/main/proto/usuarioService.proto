syntax = "proto3";
option java_multiple_files = true;
option java_package = "RpcDonaciones.grpc";
option java_outer_classname = "UsuarioServiceProto";

service UsuarioService {
    rpc registrarUsuario (UsuarioRequest) returns (UsuarioResponse);
    rpc traerUsuarioPorId (UsuarioIdRequest) returns (UsuarioResponse);
    rpc eliminarUsuario (UsuarioIdRequest) returns (EliminarUsuarioResponse);
}

message UsuarioRequest {
    string email = 1;
    string password = 2;
    string name = 3;
}

message UsuarioIdRequest {
    int64 id = 1;
}

message UsuarioResponse {
    int64 id = 1;
    string email = 2;
    string name = 3;
    string status = 4;
}

message EliminarUsuarioResponse {
    bool success = 1;
    string message = 2;
}