syntax = "proto3";
option java_package = "RpcDonaciones.grpc";
option java_outer_classname = "UsuarioServiceProto";

// ----------------- MENSAJES ---------------------

// Roles de usuario para el enum
enum Role {
    PRESIDENTE = 0;
    VOCAL = 1;
    COORDINADOR = 2;
    VOLUNTARIO = 3;
}

// Mensaje para dar de alta un usuario
message UsuarioRequest {
    string token = 1; // Token JWT del usuario que realiza la acción
    int64 id = 2;
    string nombreUsuario = 3;
    string nombre = 4;
    string apellido = 5;
    string telefono = 6;
    string email = 7;
    Role rol = 8;
    bool activo = 9;
    string clave = 10;
}

// Mensaje para obtener un usuario por ID
message UsuarioIdRequest {
    string token = 1; // Token JWT para autorización
    int64 id = 2;
}

// Mensaje de respuesta para las operaciones de usuario
message UsuarioResponse {
    int64 id = 1;
    string nombreUsuario = 2;
    string nombre = 3;
    string apellido = 4;
    string telefono = 5;
    string email = 6;
    Role rol = 7;
    bool activo = 8;
    string status = 9;
    string message = 10;
}

// Mensjae de respuesta para la baja logica de un usuario
message EliminarUsuarioResponse {
    bool success = 1;
    string message = 2;
}

message ListarUsuariosRequest {
    string token = 1; // Token JWT para autorización
}

// Mensaje de respuesta para la lista de usuarios. El campo 'repeated'
// indica que es un array de mensajes de tipo UsuarioResponse.
message ListarUsuariosResponse {
    repeated UsuarioResponse usuarios = 1;
} 


// --------------------- SERVICIOS -----------------------
service UsuarioService {
    // Puntos de entrada para el cliente web
    rpc registrarUsuario (UsuarioRequest) returns (UsuarioResponse);
    rpc traerUsuarioPorId (UsuarioIdRequest) returns (UsuarioResponse);
    rpc modificarUsuario(UsuarioRequest) returns (UsuarioResponse);
    rpc eliminarUsuario (UsuarioIdRequest) returns (EliminarUsuarioResponse);
    rpc listarUsuarios(ListarUsuariosRequest) returns (ListarUsuariosResponse);
}